name: Rules CI
on:
  pull_request:
  push:
jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate data
        run: python -m prototype.rules.cli validate-data --data-dir data/vertical_slice
      - name: Unit tests
        run: python -m unittest discover -s tests
